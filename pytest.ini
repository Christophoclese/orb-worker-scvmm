[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests for isolated components
    integration: Integration tests with mocked dependencies
    e2e: End-to-end tests with full workflow
    slow: Tests that take longer to run

# Minimum coverage threshold (80%)
# Run with: pytest --cov=scvmm --cov-report=html --cov-report=term-missing --cov-fail-under=80
[coverage:run]
branch = True
source = scvmm

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstractproperty

omit =
    */tests/*
    */test_*.py
    */__main__.py
    */site-packages/*

precision = 2

[coverage:html]
directory = htmlcov
